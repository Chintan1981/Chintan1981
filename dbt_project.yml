name: "jaffle_shop"
version: "1.0.0"
config-version: 2

dbt-cloud:
  project-id: 70471823470026

profile: "analytics"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  start_date: "2020-01-01"
  include_test_accounts: false

models:
  jaffle_shop:
    +materialized: table
    
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: analytics

      finance:
        +schema: analytics_finance
        +tags: ["finance", "daily"]

      marketing:
        +schema: analytics_marketing
        +tags: ["marketing"]

seeds:
  jaffle_shop:
    +schema: reference_data

snapshots:
  jaffle_shop:
    +target_schema: snapshots


